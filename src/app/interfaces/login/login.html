<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white">
  <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-400">
        carShop <i class="fa-solid fa-car"></i>
    </h2>
    
    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg">
        {{ errorMessage }}
      </div>
    }

    <form (submit)="$event.preventDefault(); iniciarSesion()">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Correo electrónico</label>
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        required
        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white"
        placeholder="tucorreo@email.com">
    </div>

    <div class="mb-6 relative">
      <label class="block text-sm font-medium mb-2">Contraseña</label>
      <input 
        [type]="verPassword ? 'text' : 'password'" 
        [(ngModel)]="password" 
        name="password" 
        required
        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white pr-10"
        placeholder="••••••••">
      
      <button 
        type="button" 
        (click)="alternarPassword()" 
        class="absolute right-3 top-9 text-gray-400 hover:text-white text-sm">
        <i class="fa-solid" [ngClass]="verPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
      </button>
    </div>

    <button 
      type="submit" 
      class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition duration-200">
      Iniciar Sesión
    </button>
    <button 
      type="button"
      (click)="continuarComoInvitado()"
      class="w-full mt-3 bg-gray-600 hover:bg-gray-500 text-white font-bold py-2.5 rounded-lg transition duration-200">
      Continuar sin cuenta (Invitado)
    </button>
  </form>
  </div>
</div>
