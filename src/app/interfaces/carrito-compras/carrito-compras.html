<div class="min-h-screen bg-gray-900 text-white p-6">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <h1 class="text-3xl font-bold text-blue-400">
        <i class="fa-solid fa-cart-shopping mr-2"></i> Tu Carrito de Compras
      </h1>
      <button (click)="irALaTienda()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold transition">
        <i class="fa-solid fa-store mr-2"></i> Seguir Comprando
      </button>
    </header>

    @if (itemsCarrito.length === 0) {
      <div class="bg-gray-800 border border-gray-700 rounded-2xl p-10 text-center shadow-xl">
        <i class="fa-solid fa-car-side text-6xl text-gray-600 mb-4"></i>
        <h2 class="text-xl font-bold text-gray-300">Tu carrito está vacío</h2>
        <p class="text-gray-500 text-sm mt-2">Aún no has agregado ningún auto.</p>
        <button (click)="irALaTienda()" class="mt-6 bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold transition">
          Ver Catálogo
        </button>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-4">
          @for (item of itemsCarrito; track $index) {
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl flex items-center justify-between shadow-lg">
              <div class="flex items-center space-x-4">
                <img [src]="item.imagen" [alt]="item.nombre" class="w-20 h-16 object-cover rounded-lg bg-gray-700">
                <div>
                  <span class="text-xs uppercase text-blue-400 font-semibold">{{ item.marca }}</span>
                  <h3 class="font-bold text-lg">{{ item.nombre }}</h3>
                  <p class="text-green-400 font-black">${{ item.precio }} USD</p>
                </div>
              </div>
              <button (click)="quitarItem($index)" class="text-red-400 hover:text-red-300 p-2 transition" title="Eliminar">
                <i class="fa-solid fa-trash-can text-lg"></i>
              </button>
            </div>
          }
        </div>

        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-xl h-fit">
          <h3 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Resumen de Orden</h3>
          <div class="flex justify-between mb-4 text-gray-300">
            <span>Total:</span>
            <span class="text-2xl font-black text-green-400">${{ precioTotal }} USD</span>
          </div>
          <button (click)="irAlPago()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-credit-card"></i> Proceder al Pago
          </button>
        </div>
      </div>
    }
  </div>
</div>
